openapi: '3.0.3'
info:
  title: TMDB Search API
  version: '3.0.0'
  description: The Movie Database public REST API for searching movies and fetching details.

servers:
  - url: https://api.themoviedb.org/3

paths:
  /search/movie:
    get:
      operationId: searchMovies
      summary: Search for movies by query string
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Search query (movie title)
        - name: api_key
          in: query
          required: true
          schema:
            type: string
          description: TMDB API key
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for paginated results
      responses:
        '200':
          description: Successful search response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        overview:
                          type: string
                        poster_path:
                          type: string
                        release_date:
                          type: string
                        vote_average:
                          type: number
                        genre_ids:
                          type: array
                          items:
                            type: integer

  /movie/{movieId}:
    get:
      operationId: getMovieById
      summary: Fetch detailed info for a specific movie
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: integer
          description: The TMDB movie ID
        - name: api_key
          in: query
          required: true
          schema:
            type: string
          description: TMDB API key
      responses:
        '200':
          description: Movie details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  overview:
                    type: string
                  poster_path:
                    type: string
                  backdrop_path:
                    type: string
                  release_date:
                    type: string
                  runtime:
                    type: integer
                  vote_average:
                    type: number
                  genres:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  tagline:
                    type: string
                  status:
                    type: string
