server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Content-hashed build assets — safe to cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: BrowserRouter paths (/plans, /my-activity, ...) are not
  # real files, so serve index.html and let the client router take over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the HTML shell itself, so a redeploy is picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
